<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d">
<title id="t">Little moments add up</title><desc id="d">Three designed cards show building something, exploring together, and just being around.</desc>
<rect width="1920" height="1080" fill="#FFFBF3"/><text x="960" y="155" text-anchor="middle" fill="#55644A" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="800" letter-spacing="7">MORE THAN ONE WAY TO HANG OUT</text><text x="960" y="270" text-anchor="middle" fill="#2D2923" font-family="Inter,Arial,sans-serif" font-size="78" font-weight="880" letter-spacing="-4">Little moments add up.</text>
<g transform="translate(150 365) rotate(-2 250 300)"><rect width="500" height="520" rx="30" fill="#EFE7D7"/><rect x="28" y="28" width="444" height="340" rx="22" fill="#7F936F"/><path d="M28 290 145 155l105 105 93-93 129 173H28Z" fill="#55644A"/><rect x="160" y="185" width="155" height="155" fill="#C9A968"/><rect x="195" y="222" width="85" height="118" fill="#2D2923"/><rect x="205" y="235" width="22" height="30" fill="#FFFBF3"/><text x="38" y="430" fill="#2D2923" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="850">BUILD SOMETHING</text><text x="38" y="476" fill="#6F665A" font-family="Inter,Arial,sans-serif" font-size="23">One block at a time.</text></g>
<g transform="translate(710 345)"><rect width="500" height="540" rx="30" fill="#2D2923"/><rect x="28" y="28" width="444" height="355" rx="22" fill="#55644A"/><circle cx="250" cy="205" r="125" fill="none" stroke="#C9A968" stroke-width="9"/><path d="M250 88V205l95 58" fill="none" stroke="#FFFBF3" stroke-width="12" stroke-linecap="round"/><circle cx="250" cy="205" r="13" fill="#FFFBF3"/><text x="38" y="445" fill="#FFFBF3" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="850">EXPLORE TOGETHER</text><text x="38" y="491" fill="#EFE7D7" font-family="Inter,Arial,sans-serif" font-size="23">See where the day goes.</text></g>
<g transform="translate(1270 365) rotate(2 250 300)"><rect width="500" height="520" rx="30" fill="#EADBD5"/><rect x="28" y="28" width="444" height="340" rx="22" fill="#C78F82"/><g fill="#FFFBF3"><circle cx="150" cy="150" r="53"/><circle cx="250" cy="150" r="53"/><circle cx="350" cy="150" r="53"/></g><g fill="#2D2923"><path d="M80 315q70-120 140 0M180 315q70-120 140 0M280 315q70-120 140 0"/></g><text x="38" y="430" fill="#2D2923" font-family="Inter,Arial,sans-serif" font-size="31" font-weight="850">JUST BE AROUND</text><text x="38" y="476" fill="#6F665A" font-family="Inter,Arial,sans-serif" font-size="23">That counts, too.</text></g>
