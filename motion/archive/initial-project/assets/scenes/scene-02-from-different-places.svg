<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="t d">
<title id="t">From different places</title><desc id="d">A map of dotted connections between four stylized friend portraits and message bubbles.</desc>
<defs><pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#948979" opacity=".22"/></pattern></defs><rect width="1920" height="1080" fill="#FFFBF3"/><rect width="1920" height="1080" fill="url(#dots)"/>
<text x="150" y="195" fill="#55644A" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="800" letter-spacing="7">A PLACE FOR PEOPLE</text><text x="150" y="330" fill="#2D2923" font-family="Inter,Arial,sans-serif" font-size="92" font-weight="850" letter-spacing="-4">From different</text><text x="150" y="430" fill="#2D2923" font-family="Inter,Arial,sans-serif" font-size="92" font-weight="850" letter-spacing="-4">places.</text><rect x="150" y="486" width="470" height="7" rx="4" fill="#C9A968"/><text x="150" y="565" fill="#6F665A" font-family="Inter,Arial,sans-serif" font-size="30">Different time zones, stories, and corners</text><text x="150" y="610" fill="#6F665A" font-family="Inter,Arial,sans-serif" font-size="30">of the world — one place to meet.</text>
