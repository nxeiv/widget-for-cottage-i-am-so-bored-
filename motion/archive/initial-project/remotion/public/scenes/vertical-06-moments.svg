<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920"><rect width="1080" height="1920" fill="#FFFBF3"/><text x="540" y="165" text-anchor="middle" fill="#55644A" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="800" letter-spacing="4">MORE THAN ONE WAY TO HANG OUT</text><text x="540" y="265" text-anchor="middle" fill="#2D2923" font-family="Inter,Arial,sans-serif" font-size="62" font-weight="880">Little moments add up.</text><g transform="translate(95 370)"><rect width="890" height="410" rx="28" fill="#EFE7D7"/><rect x="25" y="25" width="285" height="360" rx="20" fill="#7F936F"/><path d="M25 300 110 180 180 250 245 160 310 300V385H25Z" fill="#55644A"/><rect x="110" y="170" width="120" height="135" fill="#C9A968"/><rect x="140" y="205" width="60" height="100" fill="#2D2923"/><text x="350" y="185" fill="#2D2923" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="850">BUILD SOMETHING</text><text x="350" y="235" fill="#6F665A" font-family="Inter,Arial,sans-serif" font-size="25">One block at a time.</text></g><g transform="translate(95 820)"><rect width="890" height="410" rx="28" fill="#2D2923"/><rect x="25" y="25" width="285" height="360" rx="20" fill="#55644A"/><circle cx="167" cy="205" r="95" fill="none" stroke="#C9A968" stroke-width="8"/><path d="M167 110V205l70 42" stroke="#FFFBF3" stroke-width="10" stroke-linecap="round" fill="none"/><circle cx="167" cy="205" r="10" fill="#FFFBF3"/><text x="350" y="185" fill="#FFFBF3" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="850">EXPLORE TOGETHER</text><text x="350" y="235" fill="#EFE7D7" font-family="Inter,Arial,sans-serif" font-size="25">See where the day goes.</text></g><g transform="translate(95 1270)"><rect width="890" height="410" rx="28" fill="#EADBD5"/><rect x="25" y="25" width="285" height="360" rx="20" fill="#C78F82"/><g fill="#FFFBF3"><circle cx="105" cy="160" r="35"/><circle cx="168" cy="160" r="35"/><circle cx="231" cy="160" r="35"/></g><g fill="#2D2923"><path d="M55 305q50-100 100 0M118 305q50-100 100 0M181 305q50-100 100 0"/></g><text x="350" y="185" fill="#2D2923" font-family="Inter,Arial,sans-serif" font-size="36" font-weight="850">JUST BE AROUND</text><text x="350" y="235" fill="#6F665A" font-family="Inter,Arial,sans-serif" font-size="25">That counts, too.</text></g></svg>